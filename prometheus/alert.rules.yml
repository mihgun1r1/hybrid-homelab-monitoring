groups:
  - name: infrastructure_alerts
    rules:
      # Alert: Host or exporter down
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Target {{ $labels.instance }} is down"
          description: "Target {{ $labels.instance }} has been unreachable for more than 1 minute."

      # Alert: High CPU load (more than 85% for 2 minutes)
      - alert: HighCpuUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU load is currently at {{ $value | printf \"%.2f\" }}%."